[package]
name = "netrunner-client"
version = "0.1.0"
edition = "2021"

[[example]]
name = "client_example"
path = "examples/client_example.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
netrunner-common = { path = "../common" } # Наша общая либа
smoltcp = { version = "0.12.0", default-features = false, features = ["medium-ip", "proto-ipv4", "socket-tcp"] }
tokio = { version = "1.36", features = ["full"] }
jni = "0.21"
bytes = "1.5"
android_logger = "0.13"
log = "0.4"
tun = "0.8.5"
lazy_static = "1.4.0"
libc = "0.2.182"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
