[package]
name = "netrunner-loadtest"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "loadtest"
path = "src/main.rs"

[dependencies]
netrunner-core = { path = "../../core" }
tokio = { version = "1.49.0", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1.5"
libc = "0.2"
