[package]
name = "netrunner-app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "netrunner_app"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
netrunner-client = { path = "../../client" }
netrunner-core = { path = "../../core" }
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
