[package]
name = "app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "netrunner-app"  
path = "main.rs"



[build-dependencies]
tauri-build = { version = "2.0.0" }

[dependencies]
netrunner-client = { path = "../../client" }
netrunner-core = { path = "../../core" }
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }