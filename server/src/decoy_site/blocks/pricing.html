<section class="pricing" id="pricing">
  <h2 class="section__title">{{title}}</h2>
  <div class="grid grid--3">
    <article class="plan"><h3>{{p1_name}}</h3><p class="plan__price">{{p1_price}}</p><p class="plan__meta">{{p1_meta}}</p><a class="btn btn--ghost" href="/signup">{{p1_cta}}</a></article>
    <article class="plan plan--hot"><span class="plan__tag">{{p2_tag}}</span><h3>{{p2_name}}</h3><p class="plan__price">{{p2_price}}</p><p class="plan__meta">{{p2_meta}}</p><a class="btn btn--solid" href="/signup">{{p2_cta}}</a></article>
    <article class="plan"><h3>{{p3_name}}</h3><p class="plan__price">{{p3_price}}</p><p class="plan__meta">{{p3_meta}}</p><a class="btn btn--ghost" href="/contact">{{p3_cta}}</a></article>
  </div>
</section>
