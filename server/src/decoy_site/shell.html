<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{page_description}}">
<style>
:root{--bg:#0b0d12;--panel:#12151d;--ink:#e8ecf4;--mut:#94a0b4;--line:#20263200;--accent:{{accent}};--accent2:{{accent2}};--radius:16px}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.nav__wrap,.hero__inner,.features,.pricing,.stats,.logos,.cta,.foot{max-width:1120px;margin:0 auto;padding:0 24px}
.nav{position:sticky;top:0;backdrop-filter:blur(10px);background:rgba(11,13,18,.72);border-bottom:1px solid #1b2130;z-index:9}
.nav__wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;gap:10px;align-items:center;font-weight:700}
.brand__logo{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:16px}
.nav__links{display:flex;gap:22px;align-items:center;font-size:14px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
.btn--solid{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn--ghost{border:1px solid #2a3242;color:var(--ink)}
.btn--lg{padding:14px 26px;font-size:16px}
.hero{padding:96px 0 72px;text-align:center;background:radial-gradient(60% 120% at 50% -10%,rgba(124,92,255,.18),transparent)}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;background:#181d2a;border:1px solid #262f42;color:var(--mut);font-size:13px;margin-bottom:22px}
.hero__title{font-size:clamp(34px,6vw,60px);line-height:1.05;letter-spacing:-.02em;margin:0 0 18px;font-weight:800}
.hero__sub{font-size:19px;color:var(--mut);max-width:620px;margin:0 auto 30px}
.hero__actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.hero__note{margin-top:18px;color:var(--mut);font-size:13px}
.logos{padding:44px 24px;text-align:center}
.logos__label{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.14em;margin:0 0 18px}
.logos__row{display:flex;gap:38px;justify-content:center;flex-wrap:wrap;color:#5c6678;font-weight:700;font-size:19px}
.section__title{text-align:center;font-size:34px;font-weight:800;letter-spacing:-.02em;margin:0 0 40px}
.features,.pricing{padding:72px 24px}
.grid{display:grid;gap:20px}.grid--3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card,.plan{background:var(--panel);border:1px solid #1c2230;border-radius:var(--radius);padding:28px}
.card__ic{font-size:26px;margin-bottom:14px}.card h3,.plan h3{margin:0 0 8px;font-size:19px}
.card p{color:var(--mut);margin:0}
.stats{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;padding:36px 24px}
.stat{background:var(--panel);border:1px solid #1c2230;border-radius:var(--radius);padding:24px 34px;text-align:center;min-width:200px}
.stat__num{display:block;font-size:36px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat__lbl{color:var(--mut);font-size:14px}
.plan{position:relative;text-align:center}.plan--hot{border-color:var(--accent)}
.plan__tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:12px;padding:3px 12px;border-radius:999px}
.plan__price{font-size:38px;font-weight:800;margin:8px 0}.plan__meta{color:var(--mut);margin:0 0 18px}
.cta{text-align:center;padding:84px 24px;background:radial-gradient(60% 120% at 50% 110%,rgba(124,92,255,.16),transparent)}
.cta h2{font-size:34px;font-weight:800;margin:0 0 12px}.cta p{color:var(--mut);margin:0 0 26px}
.foot{padding:60px 24px 40px;border-top:1px solid #1b2130;margin-top:40px}
.foot__cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:28px}
.foot__cols h4{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:0 0 12px}
.foot__cols a{display:block;color:var(--mut);font-size:14px;padding:3px 0}
.foot__tag{color:var(--mut);font-size:14px;max-width:260px}
.foot__fine{color:#5c6678;font-size:13px;margin-top:34px;text-align:center}
@media(max-width:720px){.nav__links a:not(.btn){display:none}.foot__cols{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
{{body}}
</body>
</html>
