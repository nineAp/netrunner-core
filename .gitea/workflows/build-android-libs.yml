# Android-библиотеки запускаются отдельно от серверного образа:
# автоматически на push в main и version tags, также доступен ручной запуск.
name: Build Android Client Libraries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Собирает netrunner-client + netrunner-logger (обе — отдельные cdylib, см.
  # комментарий в Makefile::build-android) на все 4 Android ABI + генерит
  # uniffi Kotlin-биндинги, публикует generic-пакетом в Package Registry самой
  # Gitea (scripts/publish-android-client-libs.mjs) — оттуда их забирает
  # netrunner-app в СВОЁМ CI (fetch-client-libs.mjs). Раньше этот джоб ссылался
  # на scripts/gitea-publish-release.mjs, которого в ЭТОМ репозитории вообще
  # нет (скопирован по недоразумению из netrunner-app) — джоба падала на
  # последнем шаге, ни разу не публикуя ничего. Плюс `--bin netrunner-client`
  # вместо `-p ... --lib` не производил cdylib вообще (см. Makefile).
  build-android-libs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # `packages: ""` — Google в середине сентября 2026 выпилил legacy-пакет
      # `tools` из манифеста SDK-репозитория; дефолтный список этого action'а
      # его всё ещё запрашивает и падает на отсутствующем пакете (известная
      # массовая проблема, см. android-actions/setup-android#537). Пустой
      # `packages` пропускает этот сломанный дефолтный install, но всё ещё
      # поднимает ANDROID_HOME/cmdline-tools и принимает лицензии — этого
      # достаточно, конкретные пакеты (NDK) ставим отдельным шагом ниже.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"

      # ВАЖНО: `${{ env.ANDROID_NDK_ROOT }}` (как в netrunner-app) здесь пуст —
      # реальный прогон падал "Error detecting NDK version for path" (путь был
      # пустой строкой). android-actions/setup-android@v3 не экспортирует
      # ANDROID_NDK_ROOT в этом раннере/версии; в netrunner-app это, похоже,
      # никогда и не было load-bearing (Tauri находит NDK сам через свои
      # средства, независимо от этой переменной) — а для cargo-ndk путь
      # обязателен. Вычисляем и проверяем путь сами, не полагаясь на угаданное
      # имя переменной от стороннего action'а.
      - name: Resolve NDK path
        id: ndk
        run: |
          set -e
          NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          if [ ! -d "$NDK_PATH" ]; then
            echo "NDK не найден по ожидаемому пути: $NDK_PATH" >&2
            echo "Содержимое \$ANDROID_HOME/ndk:" >&2
            ls "$ANDROID_HOME/ndk" >&2 || true
            exit 1
          fi
          echo "path=$NDK_PATH" >> "$GITHUB_OUTPUT"

      # Кеш сборки: без него каждый пуш компилировал весь граф зависимостей с нуля
      # под 4 ABI. По одному каталогу target на ABI (см. параллельный шаг ниже) —
      # так ключ кеша стабилен, а ABI не мешают друг другу.
      - name: Cache cargo (Android libs)
        uses: actions/cache@v4
        timeout-minutes: 3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-android
          key: cargo-android-libs-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-android-libs-

      # Готовый бинарь вместо `cargo install` (сборка из исходников — минуты на
      # каждый запуск). Если загрузка не удалась — прежний путь через cargo install.
      - name: Install cargo-ndk
        run: |
          command -v cargo-ndk >/dev/null && exit 0
          V=v4.1.2
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL --retry 3 "https://github.com/bbqsrc/cargo-ndk/releases/download/$V/cargo-ndk-x86_64-unknown-linux-gnu-$V.tgz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" 2>/dev/null && command -v cargo-ndk >/dev/null \
            || cargo install cargo-ndk

      # Универсального .so под все архитектуры не бывает, поэтому ускоряем иначе:
      # все 4 ABI собираются ПАРАЛЛЕЛЬНО (раньше — по очереди), каждый в своём
      # CARGO_TARGET_DIR, иначе cargo сериализует их блокировкой каталога сборки.
      - name: Build Android client libs (4 ABI, parallel) + uniffi Kotlin bindings
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.path }}
        run: |
          set -e
          pids=""
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            (
              export CARGO_TARGET_DIR="target-android/$abi"
              cargo ndk -t "$abi" -o ./gen build --release -p netrunner-client -p netrunner-logger --lib
            ) &
            pids="$pids $!"
          done
          fail=0
          for pid in $pids; do wait "$pid" || fail=1; done
          [ "$fail" = 0 ] || { echo "сборка одного из ABI упала" >&2; exit 1; }
          cargo run --bin bindgen-tool generate \
            --library gen/arm64-v8a/libnetrunner_client.so \
            --language kotlin --no-format --out-dir gen

      - name: Publish to Gitea package registry
        env:
          GITEA_TOKEN: ${{ secrets.GT_REGISTRY_TOKEN }}
          # Захардкожено (не vars.GITEA_SERVER_URL): переменная не заведена в
          # Settings этого репозитория — упало с "GITEA_SERVER_URL обязательна".
          # Значение публичное, не секрет (сам этот файл уже хардкодит тот же
          # домен для Docker-логина/тега образа выше) — заводить ради него
          # ещё один per-repo var смысла нет.
          GITEA_SERVER_URL: https://gitea.netrunner-vpn.com
          GITEA_OWNER: nineap
        run: node scripts/publish-android-client-libs.mjs gen

