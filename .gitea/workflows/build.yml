# Собирает netrunner-server (release-бинарник) и пушит Docker-образ во
# встроенный Container Registry самой Gitea (gitea.netrunner-vpn.com), не
# ghcr.io. Dockerfile теперь компилирует Rust ВНУТРИ себя (multi-stage,
# см. Dockerfile) — раньше бинарник собирался отдельным шагом прямо на
# CI-раннере (glibc раннера) и просто копировался в рантайм-образ
# (glibc bookworm-slim), рассинхрон версий ронял прод: "GLIBC_2.38 not
# found". Раздельная сборка на раннере убрана — только docker build.
#
# Нужен секрет GT_REGISTRY_TOKEN — токен Gitea с правом write:package,
# тот же, что и в netrunner-backend/netrunner-landing (пакеты в Gitea
# принадлежат аккаунту, не репозиторию, но значение нужно продублировать в
# Settings каждого из репозиториев).
name: Build & Push Proxy Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.netrunner-vpn.com
          username: ${{ github.actor }}
          password: ${{ secrets.GT_REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: gitea.netrunner-vpn.com/nineap/netrunner-proxy:latest
          # type=gha требует GitHub Actions Cache — self-hosted act_runner его
          # не реализует (см. аналогичный фикс в netrunner-backend/build.yml
          # этой же сессии); type=registry работает везде без спецсервиса.
          cache-from: type=registry,ref=gitea.netrunner-vpn.com/nineap/netrunner-proxy:cache
          cache-to: type=registry,ref=gitea.netrunner-vpn.com/nineap/netrunner-proxy:cache,mode=max

  # Собирает netrunner-client + netrunner-logger (обе — отдельные cdylib, см.
  # комментарий в Makefile::build-android) на все 4 Android ABI + генерит
  # uniffi Kotlin-биндинги, публикует generic-пакетом в Package Registry самой
  # Gitea (scripts/publish-android-client-libs.mjs) — оттуда их забирает
  # netrunner-app в СВОЁМ CI (fetch-client-libs.mjs). Раньше этот джоб ссылался
  # на scripts/gitea-publish-release.mjs, которого в ЭТОМ репозитории вообще
  # нет (скопирован по недоразумению из netrunner-app) — джоба падала на
  # последнем шаге, ни разу не публикуя ничего. Плюс `--bin netrunner-client`
  # вместо `-p ... --lib` не производил cdylib вообще (см. Makefile).
  build-android-libs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      # Тот же проверенный на этом раннере способ поставить NDK, что уже
      # работает в netrunner-app/.gitea/workflows/release.yml (build-android) —
      # android-actions/setup-android@v3 экспортирует ANDROID_NDK_ROOT в env
      # для последующих шагов.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk

      - name: Build Android client libs (4 ABI) + uniffi Kotlin bindings
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          set -e
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cargo ndk -t "$abi" -o ./gen build --release -p netrunner-client -p netrunner-logger --lib
          done
          cargo run --bin bindgen-tool generate \
            --library gen/arm64-v8a/libnetrunner_client.so \
            --language kotlin --no-format --out-dir gen

      - name: Publish to Gitea package registry
        env:
          GITEA_TOKEN: ${{ secrets.GT_REGISTRY_TOKEN }}
          GITEA_SERVER_URL: ${{ vars.GITEA_SERVER_URL }}
          GITEA_OWNER: nineap
        run: node scripts/publish-android-client-libs.mjs gen
