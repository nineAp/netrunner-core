# Собирает netrunner-server (release-бинарник) и пушит Docker-образ в ghcr.io.
# Dockerfile сам не компилирует Rust — он просто копирует уже готовый
# target/release/netrunner-server (см. Dockerfile), поэтому cargo build идёт
# отдельным шагом перед docker build, не внутри него.
#
# Нужен секрет GHCR_TOKEN — настоящий GitHub PAT с правом write:packages
# (автотокен Gitea для ghcr.io не годится, см. остальные .gitea/workflows/
# в других репозиториях — та же причина).
name: Build & Push Proxy Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p netrunner-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/nineap/netrunner-proxy:latest
