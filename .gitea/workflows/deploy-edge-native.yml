name: Deploy Edge Native

on:
  workflow_dispatch:

concurrency:
  group: deploy-edge-native
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Prepare deployment bundle and SSH
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
          VPN_NODE_ADDR: ${{ vars.VPN_NODE_ADDR }}
          LANDING_ADDR: ${{ vars.LANDING_ADDR }}
          BACKEND_ADDR: ${{ vars.BACKEND_ADDR }}
          DECOY_SNI: ${{ vars.DECOY_SNI }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          # Never let shell tracing print deployment credentials. Add each
          # line to the runner's mask list as defense in depth for multiline
          # SSH private keys as well as the edge auth token.
          set +x
          set -euo pipefail

          mask_secret() {
            local secret="$1"
            while IFS= read -r line; do
              [ -z "$line" ] || printf '::add-mask::%s\n' "$line"
            done <<< "$secret"
          }
          mask_secret "${DEPLOY_SSH_KEY:-}"
          mask_secret "${AUTH_TOKEN:-}"

          for name in DEPLOY_TARGET DEPLOY_KNOWN_HOSTS PUBLIC_DOMAIN VPN_NODE_ADDR LANDING_ADDR BACKEND_ADDR DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing repository Actions variable/secret: $name" >&2
              exit 1
            fi
          done

          if [[ ! "$DEPLOY_TARGET" =~ ^[A-Za-z_][A-Za-z0-9_-]*@[A-Za-z0-9.-]+$ ]]; then
            echo "DEPLOY_TARGET must have the form user@hostname-or-ipv4" >&2
            exit 1
          fi

          DECOY_SNI="${DECOY_SNI:-www.debian.org}"
          AUTH_TOKEN="${AUTH_TOKEN:-}"

          for value in "$PUBLIC_DOMAIN" "$VPN_NODE_ADDR" "$LANDING_ADDR" "$BACKEND_ADDR" "$DECOY_SNI" "$AUTH_TOKEN"; do
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "Edge configuration values must not contain newlines" >&2
              exit 1
            fi
          done

          umask 077
          mkdir -p "$RUNNER_TEMP/edge-native-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/edge-native-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/edge-native-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/edge-native-ssh/id_ed25519" "$RUNNER_TEMP/edge-native-ssh/known_hosts"

          {
            printf 'EDGE_DOMAIN=%s\n' "$PUBLIC_DOMAIN"
            printf 'VPN_NODE_ADDR=%s\n' "$VPN_NODE_ADDR"
            printf 'LANDING_ADDR=%s\n' "$LANDING_ADDR"
            printf 'BACKEND_ADDR=%s\n' "$BACKEND_ADDR"
            printf 'DECOY_SNI=%s\n' "$DECOY_SNI"
            printf 'AUTH_TOKEN=%s\n' "$AUTH_TOKEN"
          } > "$RUNNER_TEMP/edge-native.env"

          git archive --format=tar HEAD | gzip -1 > "$RUNNER_TEMP/netrunner-proxy.tar.gz"
        shell: bash

      - name: Copy source and configuration to edge VPS
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "$RUNNER_TEMP/edge-native-ssh/id_ed25519" -p 22 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/edge-native-ssh/known_hosts")
          stage="/tmp/netrunner-edge-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ssh "${ssh_opts[@]}" "$DEPLOY_TARGET" "umask 077 && mkdir -p '$stage' \"\$HOME/netrunner-proxy\""
          scp -i "$RUNNER_TEMP/edge-native-ssh/id_ed25519" -P 22 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/edge-native-ssh/known_hosts" \
            "$RUNNER_TEMP/netrunner-proxy.tar.gz" "$RUNNER_TEMP/edge-native.env" "$DEPLOY_TARGET:$stage/"
        shell: bash

      - name: Build and restart Edge Native
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "$RUNNER_TEMP/edge-native-ssh/id_ed25519" -p 22 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/edge-native-ssh/known_hosts")
          stage="/tmp/netrunner-edge-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ssh "${ssh_opts[@]}" "$DEPLOY_TARGET" "set -eu
            DEPLOY_PATH=\"\$HOME/netrunner-proxy\"
            trap \"rm -f '$stage/netrunner-proxy.tar.gz' '$stage/edge-native.env'; rmdir '$stage'\" EXIT
            tar -xzf '$stage/netrunner-proxy.tar.gz' -C \"\$DEPLOY_PATH\"
            install -m 600 '$stage/edge-native.env' \"\$DEPLOY_PATH/edge-native/.env\"
            cp \"\$DEPLOY_PATH/edge-native/Caddyfile.example\" \"\$DEPLOY_PATH/edge-native/Caddyfile\"
            cd \"\$DEPLOY_PATH/edge-native\"
            docker compose up -d --build --remove-orphans
            docker compose ps
          "
        shell: bash
